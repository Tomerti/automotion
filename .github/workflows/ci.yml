name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          # e2e/latex-samples.spec.ts exports LaTeX through the app into this folder.
          LATEX_SAMPLES_DIR: latex-samples
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: latex-samples
          path: latex-samples/
          if-no-files-found: error
          retention-days: 7

  # Compile the LaTeX the app exported in e2e with a real TeX engine.
  latex:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: latex-samples
          path: latex-samples
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures
      - name: Compile every exported .tex
        working-directory: latex-samples
        run: |
          for f in *.tex; do
            echo "::group::$f"
            pdflatex -interaction=nonstopmode -halt-on-error "$f"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: latex-pdfs
          path: latex-samples/*.pdf
          retention-days: 7

  # Publish to GitHub Pages only from a push to master, and only once every check has passed.
  # Build and deploy are separate jobs (GitHub's own Pages setup): deploy-pages run in the job that
  # uploaded the site looked it up a moment later and often didn't find it yet ("No artifacts
  # named github-pages"). A failed deploy can then be re-run alone, reusing the upload.
  pages:
    needs: [check, e2e, latex]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
